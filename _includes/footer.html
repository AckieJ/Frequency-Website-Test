{%- assign g = site.data.group -%}
<footer class="site-footer on-dark">
  <div class="wrap site-footer__in">
    <p class="site-footer__name">{% include mark.html %} {{ g.name }}</p>
    <ul class="site-footer__links">
      {%- if g.email != blank %}<li><a href="mailto:{{ g.email }}">{{ g.email }}</a></li>{% endif -%}
      {%- for s in g.socials %}{% if s.url != blank %}<li><a href="{{ s.url }}" rel="noopener">{{ s.name }}</a></li>{% endif %}{% endfor -%}
    </ul>
    <p class="site-footer__small">&copy; {{ site.time | date: "%Y" }} {{ g.name }}</p>
  </div>
</footer>
