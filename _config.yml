# Site settings. Most people never need to open this file.
# Everything you would normally edit (text, photos, videos, shows, board)
# lives in the _data folder. See docs/EDITING.md.

title: The Frequency
description: "The Frequency is an a cappella group at UC San Diego."
lang: en

# Fill these in after you turn on GitHub Pages (see docs/PUBLISHING.md).
# url is only used for link previews when the site is shared.
url: ""        # for example "https://thefrequency.github.io"
baseurl: "/Frequency-Website-Test"    # leave empty for username.github.io or a custom domain;
               # use "/repo-name" if the site lives at username.github.io/repo-name

markdown: kramdown
permalink: pretty

# Files that belong to the repository but are not part of the website.
exclude:
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - docs
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
