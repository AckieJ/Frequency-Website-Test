# Site settings. Most people never need to open this file.
# Everything you would normally edit (text, photos, videos, shows, board)
# lives in the _data folder. See docs/EDITING.md.

title: The Frequency
description: "The Frequency is an a cappella group at UC San Diego."
lang: en

# Where the site lives. This is already set for the GitHub repository
# AckieJ/Frequency-Website-Test. If you move to a custom domain (like
# frequency.org), change baseurl to "" and url to the new address.
url: "https://ackiej.github.io"
baseurl: "/Frequency-Website-Test"

markdown: kramdown
permalink: pretty

# Files that belong to the repository but are not part of the website.
exclude:
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - docs
  - scripts
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
